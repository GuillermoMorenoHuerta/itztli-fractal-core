<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZTLI FRACTAL CORE</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; overflow: hidden; 
            font-family: 'Times New Roman', Times, serif;
        }
        
        #splash {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-in-out;
        }
        
        .logo-container {
            text-align: center;
            animation: fadeInScale 1.5s ease-out;
        }
        .logo-container img {
            max-width: 70%;
            max-height: 70vh;
            display: block;
            margin: 0 auto;
        }
        
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 0.8; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        #rayo-fractal {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10000; pointer-events: none;
            opacity: 0;
            transition: opacity 0.05s linear;
        }
        
        .rayo-linea {
            position: absolute;
            background: linear-gradient(180deg, #ffffff, #aaddff, #4488ff);
            box-shadow: 0 0 20px #88aaff, 0 0 40px #2266cc;
            border-radius: 2px;
        }
        .rayo-rama {
            position: absolute;
            background: #bbddff;
            box-shadow: 0 0 8px #88aaff;
            border-radius: 1px;
        }
        
        .destello-blanco {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: white;
            z-index: 10001;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
        }
    </style>
</head>
<body>

    <div id="splash">
        <div class="logo-container">
            <img src="assets/logo.jpg" alt="ITZTLI Fractal Core">
        </div>
    </div>

    <div id="rayo-fractal"></div>
    <div id="destello" class="destello-blanco"></div>

    <script>
        function dibujarRayoFractal() {
            const contenedor = document.getElementById('rayo-fractal');
            contenedor.innerHTML = '';
            contenedor.style.opacity = '1';
            
            const ancho = window.innerWidth, alto = window.innerHeight;
            const inicioX = ancho / 2;
            let puntos = [{x: inicioX, y: 0}], yActual = 0, xActual = inicioX;
            
            while (yActual < alto) {
                yActual += Math.random() * 30 + 15;
                xActual += (Math.random() - 0.5) * 80;
                xActual = Math.min(ancho - 30, Math.max(30, xActual));
                puntos.push({x: xActual, y: Math.min(alto, yActual)});
            }
            puntos.push({x: inicioX + (Math.random() - 0.5) * 100, y: alto});
            
            for (let i = 0; i < puntos.length - 1; i++) {
                const p1 = puntos[i], p2 = puntos[i+1];
                const dx = p2.x - p1.x, dy = p2.y - p1.y;
                const longitud = Math.hypot(dx, dy);
                const angulo = Math.atan2(dy, dx) * 180 / Math.PI;
                
                const linea = document.createElement('div');
                linea.className = 'rayo-linea';
                linea.style.width = longitud + 'px';
                linea.style.height = (Math.random() * 6 + 4) + 'px';
                linea.style.left = p1.x + 'px';
                linea.style.top = p1.y + 'px';
                linea.style.transform = 'rotate(' + angulo + 'deg)';
                linea.style.transformOrigin = '0 0';
                contenedor.appendChild(linea);
                
                if (i > 0 && i < puntos.length - 2 && Math.random() > 0.3) {
                    const lr = longitud * (0.4 + Math.random() * 0.6);
                    const ar = angulo + (Math.random() - 0.5) * 100;
                    const rama = document.createElement('div');
                    rama.className = 'rayo-rama';
                    rama.style.width = lr + 'px';
                    rama.style.height = (Math.random() * 4 + 2) + 'px';
                    rama.style.left = p2.x + 'px';
                    rama.style.top = p2.y + 'px';
                    rama.style.transform = 'rotate(' + ar + 'deg)';
                    rama.style.transformOrigin = '0 0';
                    contenedor.appendChild(rama);
                }
            }
            
            setTimeout(() => { contenedor.style.opacity = '0'; }, 300);
        }

        window.addEventListener('load', function() {
            const splash = document.getElementById('splash');
            const destello = document.getElementById('destello');
            const audio = new Audio('assets/audio/trueno.mp3');
            
            // Trueno suena INMEDIATAMENTE al cargar
            audio.play().catch(e => console.log('Audio no soportado'));
            
            // A los 4.5 segundos: rayo fractal
            setTimeout(() => { dibujarRayoFractal(); }, 4500);
            
            // A los 5 segundos: destello blanco
            setTimeout(() => {
                destello.style.opacity = '1';
                setTimeout(() => { destello.style.opacity = '0'; }, 150);
            }, 5000);
            
            // A los 5.5 segundos: desvanecer splash
            setTimeout(() => { splash.style.opacity = '0'; }, 5500);
            
            // A los 7 segundos: redirigir a inicio.html
            setTimeout(() => {
                splash.style.display = 'none';
                window.location.href = 'inicio.html';
            }, 7000);
        });
    </script>
</body>
</html>
