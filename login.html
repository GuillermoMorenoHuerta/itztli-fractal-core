<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZTLI FRACTAL · Acceso</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0d0a08;
            background-image: radial-gradient(circle at 10% 20%, #2a1f12, #0d0a08 80%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: rgba(20,15,10,0.9); backdrop-filter: blur(10px);
            border: 1px solid #b8860b; border-radius: 32px; padding: 40px 30px;
            max-width: 480px; width: 100%; box-shadow: 0 20px 60px rgba(184,134,11,0.3);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .logo {
            font-size: 28px; font-weight: 700;
            background: linear-gradient(135deg, #f5d37c, #b8860b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .lang-toggle {
            background: #2a1f12; border: 1px solid #b8860b; border-radius: 40px;
            padding: 6px 12px; color: #e6c87a; font-size: 13px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        .plan-badge {
            background: rgba(184,134,11,0.15); border-radius: 40px; padding: 8px 16px;
            text-align: center; margin-bottom: 24px; font-size: 14px; color: #e6c87a;
            border: 1px dashed #b8860b; display: none;
        }
        .plan-badge strong { color: #f5d37c; text-transform: uppercase; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #c4a87a; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 14px 16px; border-radius: 40px; border: 1px solid #5a4a2a;
            background: #1a150e; color: #f0e0c0; font-size: 15px; outline: none;
        }
        .form-group input:focus { border-color: #d4a017; box-shadow: 0 0 0 3px rgba(184,134,11,0.3); }
        .captcha-row {
            display: flex; align-items: center; gap: 10px; background: #1a150e;
            border: 1px solid #5a4a2a; border-radius: 40px; padding: 8px 16px; margin-bottom: 18px;
        }
        .captcha-row span { color: #c4a87a; font-weight: bold; font-size: 18px; white-space: nowrap; }
        .captcha-row input {
            border: none; background: transparent; color: #f0e0c0; font-size: 15px;
            outline: none; width: 70px; text-align: center;
        }
        .actions { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }
        .btn-primary {
            background: linear-gradient(135deg, #d4a017, #b8860b);
            border: none; border-radius: 40px; padding: 14px; font-weight: 700;
            font-size: 16px; color: #1a150e; cursor: pointer; box-shadow: 0 6px 20px rgba(184,134,11,0.4);
        }
        .btn-secondary {
            background: transparent; border: 1px solid #8a7a5a; border-radius: 40px;
            padding: 14px; font-weight: 600; font-size: 16px; color: #d4c09a; cursor: pointer;
        }
        .error-msg {
            background: rgba(200,70,40,0.15); border-left: 4px solid #c84a28;
            padding: 10px 14px; border-radius: 12px; color: #f0b090; font-size: 14px;
            margin-top: 12px; display: none;
        }
        .extra-info { text-align: center; color: #6a5a4a; font-size: 13px; margin-top: 20px; border-top: 1px solid #2a1f12; padding-top: 18px; }
        .extra-info a { color: #d4a017; text-decoration: none; }
        @media (max-width: 480px) { .login-card { padding: 30px 20px; } .logo { font-size: 22px; } }
    </style>
</head>
<body>
<div class="login-card">
    <div class="header">
        <div class="logo">✦ ITZTLI FRACTAL</div>
        <div class="lang-toggle" id="langToggle">
            <i class="fas fa-globe"></i> <span id="langLabel">ES</span>
        </div>
    </div>

    <div class="plan-badge" id="planBadge">
        <span id="planLabelTxt">Registro · Plan</span> <strong id="planName">DEMO</strong>
    </div>

    <form id="loginForm" autocomplete="off">
        <div class="form-group" id="nombreGroup" style="display:none;">
            <label for="nombre" id="lblNombre">Nombre (opcional)</label>
            <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
        </div>
        <div class="form-group">
            <label for="email" id="lblEmail">Correo electrónico</label>
            <input type="email" id="email" placeholder="tú@ejemplo.com" required autocomplete="email">
        </div>
        <div class="form-group">
            <label for="password" id="lblPassword">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group" id="password2Group" style="display:none;">
            <label for="password2" id="lblPassword2">Verificar contraseña</label>
            <input type="password" id="password2" placeholder="••••••••">
        </div>
        <div class="form-group" id="vinGroup" style="display:none;">
            <label for="vin" id="lblVin">VIN del Vehículo</label>
            <input type="text" id="vin" placeholder="1HGBH41JXMN109186">
        </div>
        <div class="captcha-row">
            <span id="captchaText">3 + 4 = ?</span>
            <input type="text" id="captchaInput" placeholder="?" maxlength="2" inputmode="numeric">
        </div>
        <div class="error-msg" id="errorMsg"></div>
        <div class="actions">
            <button type="submit" class="btn-primary" id="btnSubmit">Iniciar sesión</button>
            <button type="button" class="btn-secondary" id="btnToggle">¿No tienes cuenta? Regístrate</button>
        </div>
    </form>
    <div class="extra-info">
        <span id="txtTerms">Al registrarte aceptas nuestros</span>
        <a href="terminos.html">Términos y condiciones</a>
    </div>
</div>

<script>
    // ═══════════════ FUNCIÓN AUTOEJECUTABLE (TODO AQUÍ DENTRO, SIN GLOBALES) ═══════════════
    (function() {
        // ══ ELEMENTOS DEL DOM ══
        const langLabel = document.getElementById('langLabel');
        const planLabelTxt = document.getElementById('planLabelTxt');
        const planName = document.getElementById('planName');
        const nombreGroup = document.getElementById('nombreGroup');
        const password2Group = document.getElementById('password2Group');
        const vinGroup = document.getElementById('vinGroup');
        const planBadge = document.getElementById('planBadge');
        const lblNombre = document.getElementById('lblNombre');
        const lblEmail = document.getElementById('lblEmail');
        const lblPassword = document.getElementById('lblPassword');
        const lblPassword2 = document.getElementById('lblPassword2');
        const lblVin = document.getElementById('lblVin');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnToggle = document.getElementById('btnToggle');
        const errorMsg = document.getElementById('errorMsg');
        const captchaText = document.getElementById('captchaText');
        const captchaInput = document.getElementById('captchaInput');
        const txtTerms = document.getElementById('txtTerms');
        const langToggle = document.getElementById('langToggle');

        // ══ INICIALIZAR SUPABASE Y STRIPE ══
        let supabase = null;
        let stripe = null;

        try {
            // Usar el objeto global window.supabase sin redeclarar
            const sb = window.supabase;
            if (sb) {
                supabase = sb.createClient(
                    'https://rpoqukrcvkcmaqsajchk.supabase.co',
                    'sb_publishable_eamhRTq61t3fVIMSUcRYwQ_-VLGFGJ5'
                );
            }
        } catch (e) { console.warn('Supabase no disponible:', e); }

        try {
            stripe = Stripe('pk_live_51SJOri22YPeLMMgswtUD9HC6bDsNrUA6Sv1WQY1kkM7WUEQRDcWSNVa09j2LGe3NdT6PiZNedeYklpwKEnNXhjsM00KTNp7fqh');
        } catch (e) { console.warn('Stripe no disponible:', e); }

        const PRICE_IDS = {
            premium: 'price_1TwjFe22YPeLMMgsYwq19tS1',
            platinum: 'price_1TwjHs22YPeLMMgsieFHKlnm'
        };

        // ══ PLAN DESDE URL ══
        const urlParams = new URLSearchParams(window.location.search);
        let selectedPlan = urlParams.get('plan') || 'demo';
        if (!['demo', 'premium', 'platinum'].includes(selectedPlan)) selectedPlan = 'demo';
        planName.textContent = selectedPlan.toUpperCase();

        // ══ IDIOMA ══
        let currentLang = 'es';
        const i18n = {
            es: {
                planLabel: 'Registro · Plan',
                lblNombre: 'Nombre (opcional)',
                lblEmail: 'Correo electrónico',
                lblPassword: 'Contraseña',
                lblPassword2: 'Verificar contraseña',
                lblVin: 'VIN del Vehículo',
                btnRegistrarse: 'Registrarse',
                btnLogin: 'Iniciar sesión',
                toggleToRegister: '¿No tienes cuenta? Regístrate',
                toggleToLogin: 'Ya tengo cuenta · Iniciar sesión',
                terms: 'Al registrarte aceptas nuestros',
                errorGeneral: 'Ocurrió un error.',
                errorEmail: 'Correo inválido.',
                errorPass: 'Mínimo 8 caracteres.',
                errorPassMatch: 'Las contraseñas no coinciden.',
                errorCaptcha: 'Captcha incorrecto.',
                errorUserExists: 'El correo ya está registrado.',
                errorInvalidCreds: 'Correo o contraseña incorrectos.',
                errorNoUser: 'No existe una cuenta con ese correo.',
                successRegister: '¡Registro exitoso! Redirigiendo...',
                successLogin: 'Inicio de sesión exitoso. Redirigiendo...',
                rateLimit: 'Demasiados intentos. Espera 5 minutos.',
                noSupabase: 'Error de conexión con la base de datos.'
            },
            en: {
                planLabel: 'Registration · Plan',
                lblNombre: 'Name (optional)',
                lblEmail: 'Email',
                lblPassword: 'Password',
                lblPassword2: 'Confirm password',
                lblVin: 'Vehicle VIN',
                btnRegistrarse: 'Sign up',
                btnLogin: 'Log in',
                toggleToRegister: 'No account? Register',
                toggleToLogin: 'Already have an account? Log in',
                terms: 'By registering you accept our',
                errorGeneral: 'An error occurred.',
                errorEmail: 'Invalid email.',
                errorPass: 'At least 8 characters.',
                errorPassMatch: 'Passwords do not match.',
                errorCaptcha: 'Captcha incorrect.',
                errorUserExists: 'Email already registered.',
                errorInvalidCreds: 'Incorrect email or password.',
                errorNoUser: 'No account found with that email.',
                successRegister: 'Registration successful! Redirecting...',
                successLogin: 'Login successful. Redirecting...',
                rateLimit: 'Too many attempts. Wait 5 minutes.',
                noSupabase: 'Database connection error.'
            }
        };

        function updateLanguage() {
            const d = i18n[currentLang];
            lblNombre.textContent = d.lblNombre;
            lblEmail.textContent = d.lblEmail;
            lblPassword.textContent = d.lblPassword;
            lblPassword2.textContent = d.lblPassword2;
            lblVin.textContent = d.lblVin;
            txtTerms.textContent = d.terms;
            langLabel.textContent = currentLang.toUpperCase();
            planLabelTxt.textContent = d.planLabel;
            updateButtonLabels();
        }

        let isRegisterMode = false;
        function updateButtonLabels() {
            const d = i18n[currentLang];
            if (isRegisterMode) {
                btnSubmit.textContent = d.btnRegistrarse;
                btnToggle.textContent = d.toggleToLogin;
            } else {
                btnSubmit.textContent = d.btnLogin;
                btnToggle.textContent = d.toggleToRegister;
            }
        }

        // Eventos de los botones (SIEMPRE FUNCIONAN)
        langToggle.addEventListener('click', () => {
            currentLang = (currentLang === 'es') ? 'en' : 'es';
            updateLanguage();
            generateCaptcha();
        });

        btnToggle.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            nombreGroup.style.display = isRegisterMode ? 'block' : 'none';
            password2Group.style.display = isRegisterMode ? 'block' : 'none';
            vinGroup.style.display = isRegisterMode ? 'block' : 'none';
            planBadge.style.display = isRegisterMode ? 'block' : 'none';
            if (isRegisterMode) {
                document.getElementById('password2').setAttribute('required', '');
                document.getElementById('vin').setAttribute('required', '');
            } else {
                document.getElementById('password2').removeAttribute('required');
                document.getElementById('vin').removeAttribute('required');
            }
            updateButtonLabels();
        });

        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            captchaText.textContent = `${num1} + ${num2} = ?`;
            captchaInput.dataset.result = num1 + num2;
            captchaInput.value = '';
        }
        generateCaptcha();

        function validateEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

        // ══ ENVÍO DEL FORMULARIO (CONEXIÓN REAL) ══
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            errorMsg.style.display = 'none';
            errorMsg.textContent = '';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const nombre = document.getElementById('nombre').value.trim();
            const vin = document.getElementById('vin').value.trim();
            const captchaVal = captchaInput.value;
            const captchaRes = captchaInput.dataset.result;

            if (!email || !password) { showError('Completa todos los campos obligatorios.'); return; }
            if (!validateEmail(email)) { showError(i18n[currentLang].errorEmail); return; }
            if (password.length < 8) { showError(i18n[currentLang].errorPass); return; }
            if (!captchaVal || parseInt(captchaVal) !== parseInt(captchaRes)) {
                showError(i18n[currentLang].errorCaptcha);
                generateCaptcha();
                return;
            }
            if (!supabase) { showError(i18n[currentLang].noSupabase); return; }

            if (isRegisterMode) {
                if (!password2) { showError('Confirma tu contraseña.'); return; }
                if (password !== password2) { showError(i18n[currentLang].errorPassMatch); return; }
                if (!vin) { showError('El VIN es obligatorio.'); return; }

                try {
                    const { data, error } = await supabase.auth.signUp({
                        email, password,
                        options: { data: { nombre, plan: selectedPlan, vin, role: 'user' } }
                    });
                    if (error) {
                        if (error.message.includes('already registered')) showError(i18n[currentLang].errorUserExists);
                        else if (error.message.includes('rate limit')) showError(i18n[currentLang].rateLimit);
                        else showError(error.message);
                        return;
                    }

                    if (selectedPlan === 'demo') {
                        showSuccess(i18n[currentLang].successRegister);
                        setTimeout(() => { window.location.href = 'bienvenida-demo.html'; }, 1000);
                    } else {
                        if (!stripe) { showError('Error de conexión con la pasarela de pago.'); return; }
                        const priceId = PRICE_IDS[selectedPlan];
                        if (!priceId) { showError('Plan no válido.'); return; }
                        showSuccess(i18n[currentLang].successRegister);
                        setTimeout(() => {
                            stripe.redirectToCheckout({
                                lineItems: [{ price: priceId, quantity: 1 }],
                                mode: 'subscription',
                                successUrl: window.location.origin + '/bienvenida-' + selectedPlan + '.html?session_id={CHECKOUT_SESSION_ID}',
                                cancelUrl: window.location.origin + '/login.html?plan=' + selectedPlan,
                            }).catch(err => showError('Error al redirigir a Stripe: ' + err.message));
                        }, 500);
                    }
                } catch (err) { showError(i18n[currentLang].errorGeneral); }
            } else {
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) {
                        if (error.message.includes('Invalid login credentials')) {
                            const { data: checkUser } = await supabase.from('usuarios').select('id').eq('email', email).maybeSingle();
                            if (!checkUser) showError(i18n[currentLang].errorNoUser);
                            else showError(i18n[currentLang].errorInvalidCreds);
                        } else if (error.message.includes('rate limit')) showError(i18n[currentLang].rateLimit);
                        else showError(error.message);
                        return;
                    }
                    const { data: userData } = await supabase.from('usuarios').select('plan').eq('id', data.user.id).single();
                    const userPlan = (userData && userData.plan) || 'demo';
                    showSuccess(i18n[currentLang].successLogin);
                    setTimeout(() => { window.location.href = 'bienvenida-' + userPlan + '.html'; }, 1000);
                } catch (err) { showError(i18n[currentLang].errorGeneral); }
            }
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            errorMsg.style.borderLeftColor = '#c84a28';
            errorMsg.style.color = '#f0b090';
        }
        function showSuccess(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            errorMsg.style.borderLeftColor = '#4aff8a';
            errorMsg.style.color = '#b0ffd0';
        }

        // ══ INICIALIZAR ══
        updateLanguage();
        updateButtonLabels();
    })();
</script>
</body>
</html>
