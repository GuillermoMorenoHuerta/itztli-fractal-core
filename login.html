<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZTLI - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0a0a0f; --card: #12121f; --border: #1e1e3a;
            --gold: #e2a03f; --cyan: #00b4d8; --text: #e0e0e0;
        }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', sans-serif; display: flex;
            justify-content: center; align-items: center; min-height: 100vh;
            background-image: radial-gradient(ellipse at center, rgba(0,180,216,0.1) 0%, transparent 70%);
        }
        .login-box {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 2.5rem; width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .login-box h1 {
            font-family: 'Orbitron', sans-serif; color: var(--gold);
            text-align: center; margin-bottom: 2rem; font-size: 1.8rem;
        }
        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: block; color: var(--cyan); margin-bottom: 4px; font-size: 0.85rem; }
        .input-group input {
            width: 100%; padding: 12px; background: #0a0a0f; border: 1px solid var(--border);
            border-radius: 8px; color: white; font-size: 1rem; outline: none;
        }
        .btn {
            width: 100%; padding: 12px; background: var(--gold); color: var(--bg);
            border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
            font-size: 1rem; transition: 0.3s; margin-top: 1rem;
        }
        .btn:hover { box-shadow: 0 0 20px rgba(226,160,63,0.5); }
        .alt-link { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; }
        .alt-link a { color: var(--cyan); cursor: pointer; text-decoration: none; }
        .error { color: #ff4444; font-size: 0.8rem; margin-bottom: 0.5rem; display: none; }
    </style>
</head>
<body>
    <div class="login-box" id="loginForm">
        <h1>💍 ITZTLI</h1>
        <div class="error" id="loginError">Error</div>
        <div class="input-group"><label>Email</label><input type="email" id="email" placeholder="admin@itzli.com"></div>
        <div class="input-group"><label>Contraseña</label><input type="password" id="password" placeholder="••••••••"></div>
        <button class="btn" id="loginBtn">Iniciar Sesión</button>
        <div class="alt-link">¿No tienes cuenta? <a id="showRegister">Regístrate</a></div>
    </div>

    <div class="login-box" id="registerForm" style="display:none;">
        <h1>💍 REGISTRO</h1>
        <div class="error" id="registerError">Error</div>
        <div class="input-group"><label>Email</label><input type="email" id="regEmail"></div>
        <div class="input-group"><label>Contraseña (mín. 8 caracteres)</label><input type="password" id="regPassword"></div>
        <button class="btn" id="registerBtn">Crear Cuenta</button>
        <div class="alt-link">¿Ya tienes cuenta? <a id="showLogin">Inicia Sesión</a></div>
    </div>

    <script>
        const supabase = window.supabase.createClient(
            'https://rpoqukrcvkcmaqsajchk.supabase.co',
            'sb_publishable_eamhRTq61t3fVIMSUcRYwQ_-VLGFGJ5'
        );

        document.getElementById('showRegister').addEventListener('click', () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        });
        document.getElementById('showLogin').addEventListener('click', () => {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        });

        // Login
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('loginError').textContent = error.message;
                document.getElementById('loginError').style.display = 'block';
            } else {
                window.location.href = 'icc.html';
            }
        });

        // Registro
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            if (password.length < 8) {
                document.getElementById('registerError').textContent = 'Contraseña muy corta';
                document.getElementById('registerError').style.display = 'block';
                return;
            }
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) {
                document.getElementById('registerError').textContent = error.message;
                document.getElementById('registerError').style.display = 'block';
            } else {
                alert('Registro exitoso. Revisa tu email para confirmar si es necesario, o consulta la consola.');
                // Si la confirmación está desactivada, redirige
                window.location.href = 'icc.html';
            }
        });
    </script>
</body>
</html>
