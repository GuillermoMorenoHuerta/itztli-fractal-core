<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITZTLI - Acceso</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#090a18">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--bg:#090a18;--card:#12142e;--border:#2a2f5a;--cyan:#00d4ff;--gold:#f5c542;--green:#00ff88;--red:#ff4466;--text:#e8e8f0;--dim:#7a8aa0}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background-image:radial-gradient(ellipse at 50% 0%,rgba(0,212,255,0.1) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(245,197,66,0.05) 0%,transparent 50%)}
        .container{width:100%;max-width:420px}
        .header-area{position:relative;margin-bottom:30px;text-align:center}
        .logo h1{font-size:32px;background:linear-gradient(135deg,#00d4ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;text-transform:uppercase}
        .logo p{color:var(--dim);font-size:13px;margin-top:5px;letter-spacing:1px}
        .lang-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:rgba(0,212,255,0.1);border:2px solid var(--cyan);color:var(--cyan);padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:bold;font-size:13px;transition:0.3s;white-space:nowrap;z-index:10}
        .lang-btn:hover{background:var(--cyan);color:#000}
        .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
        .tabs{display:flex;gap:10px;margin-bottom:25px;background:rgba(0,0,0,0.3);border-radius:12px;padding:4px}
        .tab{flex:1;text-align:center;padding:12px;cursor:pointer;border-radius:10px;font-size:14px;font-weight:600;transition:0.3s;color:var(--dim);border:none;background:transparent}
        .tab.active{background:var(--cyan);color:#000}
        .form-group{margin-bottom:18px;position:relative}
        .form-group label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
        .form-group input{width:100%;padding:14px 45px 14px 16px;background:rgba(0,0,0,0.4);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;transition:0.3s;font-family:inherit}
        .form-group input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 15px rgba(0,212,255,0.15)}
        .toggle-password{position:absolute;right:12px;top:38px;background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:18px;padding:5px;transition:0.3s;z-index:5}
        .toggle-password:hover{color:var(--cyan)}
        .btn-submit{width:100%;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;transition:0.3s;margin-top:10px;font-family:inherit;text-transform:uppercase;letter-spacing:1px}
        .btn-login{background:linear-gradient(135deg,#00d4ff,#0099ff);color:#000}
        .btn-login:hover{box-shadow:0 10px 30px rgba(0,200,255,0.3);transform:translateY(-2px)}
        .btn-register{background:linear-gradient(135deg,#f5c542,#ff8c00);color:#000}
        .btn-register:hover{box-shadow:0 10px 30px rgba(245,197,66,0.3);transform:translateY(-2px)}
        .plan-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
        .plan-card{padding:15px 10px;text-align:center;border-radius:12px;border:2px solid var(--border);cursor:pointer;transition:0.3s;background:rgba(0,0,0,0.3)}
        .plan-card:hover{border-color:var(--gold)}
        .plan-card.selected{border-color:var(--gold);background:rgba(245,197,66,0.1);box-shadow:0 0 20px rgba(245,197,66,0.15)}
        .plan-card .plan-name{font-size:14px;font-weight:bold;margin-bottom:4px}
        .plan-card .plan-price{font-size:12px;color:var(--dim)}
        .plan-card.selected .plan-name{color:var(--gold)}
        .error-msg{background:rgba(255,68,102,0.1);border:1px solid var(--red);border-radius:8px;padding:10px;color:var(--red);font-size:13px;text-align:center;margin-top:12px;display:none}
        .success-msg{background:rgba(0,255,136,0.1);border:1px solid var(--green);border-radius:8px;padding:10px;color:var(--green);font-size:13px;text-align:center;margin-top:12px;display:none}
        .password-strength{margin-top:8px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden}
        .password-strength-bar{height:100%;width:0%;transition:width 0.3s,background 0.3s;border-radius:2px}
        .strength-text{font-size:11px;margin-top:4px;text-align:right}
        .divider{display:flex;align-items:center;margin:25px 0;color:var(--dim);font-size:12px}
        .divider::before,.divider::after{content:'';flex:1;border-bottom:1px solid var(--border)}
        .divider span{padding:0 15px}
        .demo-btn{width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;background:transparent;color:var(--text);cursor:pointer;font-size:14px;font-weight:600;transition:0.3s;font-family:inherit}
        .demo-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(245,197,66,0.05)}
        .footer{text-align:center;margin-top:25px;font-size:11px;color:var(--dim)}
        @media(max-width:480px){.container{max-width:100%}.logo h1{font-size:24px}.lang-btn{padding:6px 10px;font-size:11px;right:5px}.card{padding:20px}}
    </style>
</head>
<body>

    <div class="container">
        <div class="header-area">
            <div class="logo">
                <h1>ITZTLI</h1>
                <p class="subtitle">FRACTAL CORE</p>
            </div>
            <button class="lang-btn" onclick="toggleLang()" id="langToggle">🇲🇽 ESP</button>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')" id="tabLogin">🔐 INGRESAR</button>
                <button class="tab" onclick="switchTab('register')" id="tabRegister">✨ REGISTRO</button>
            </div>

            <!-- LOGIN -->
            <div id="formLogin">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="loginEmail" placeholder="usuario@email.com">
                </div>
                <div class="form-group">
                    <label>🔑 Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="togglePass('loginPassword',this)">👁️</button>
                </div>
                <button class="btn-submit btn-login" onclick="handleLogin()">🚀 INGRESAR</button>
                <div class="error-msg" id="loginError"></div>
            </div>

            <!-- REGISTRO -->
            <div id="formRegister" style="display:none;">
                <div class="form-group">
                    <label>👤 Nombre</label>
                    <input type="text" id="regName" placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="regEmail" placeholder="usuario@email.com">
                </div>
                <div class="form-group">
                    <label>🔑 Contraseña</label>
                    <input type="password" id="regPassword" placeholder="Mínimo 8 caracteres" oninput="checkStrength()">
                    <button type="button" class="toggle-password" onclick="togglePass('regPassword',this)">👁️</button>
                    <div class="password-strength"><div class="password-strength-bar" id="strengthBar"></div></div>
                    <div class="strength-text" id="strengthText"></div>
                </div>
                <div class="form-group">
                    <label>🔑 Confirmar</label>
                    <input type="password" id="regPassword2" placeholder="Repite tu contraseña">
                    <button type="button" class="toggle-password" onclick="togglePass('regPassword2',this)">👁️</button>
                </div>
                
                <label style="font-size:12px;color:var(--dim);margin-bottom:8px;display:block;">💳 PLAN</label>
                <div class="plan-selector">
                    <div class="plan-card selected" onclick="selectPlan('premium')" id="planPremium">
                        <div class="plan-name">🥈 PREMIUM</div>
                        <div class="plan-price">$29.99/mes</div>
                    </div>
                    <div class="plan-card" onclick="selectPlan('platinum')" id="planPlatinum">
                        <div class="plan-name">🥇 PLATINUM</div>
                        <div class="plan-price">$49.99/mes</div>
                    </div>
                </div>

                <button class="btn-submit btn-register" onclick="handleRegister()">✨ CREAR CUENTA Y PAGAR</button>
                <div class="error-msg" id="registerError"></div>
                <div class="success-msg" id="registerSuccess"></div>
            </div>

            <div class="divider"><span>o</span></div>
            <button class="demo-btn" onclick="handleDemo()">⚡ PROBAR MODO DEMO</button>
        </div>

        <div class="footer">🌀 ITZTLI FRACTAL CORE © 2026</div>
    </div>

    <script>
        // ═══════════════ VARIABLES ═══════════════
        let isSpanish = true;
        let selectedPlan = 'premium';
        let currentTab = 'login';

        // ═══════════════ FUNCIONES SIMPLES ═══════════════
        function toggleLang() {
            isSpanish = !isSpanish;
            document.getElementById('langToggle').innerHTML = isSpanish ? '🇲🇽 ESP' : '🇺🇸 ENG';
            document.getElementById('tabLogin').textContent = isSpanish ? '🔐 INGRESAR' : '🔐 SIGN IN';
            document.getElementById('tabRegister').textContent = isSpanish ? '✨ REGISTRO' : '✨ REGISTER';
            document.querySelector('.btn-login').textContent = isSpanish ? '🚀 INGRESAR' : '🚀 SIGN IN';
            document.querySelector('.btn-register').textContent = isSpanish ? '✨ CREAR CUENTA Y PAGAR' : '✨ CREATE ACCOUNT & PAY';
            document.querySelector('.demo-btn').textContent = isSpanish ? '⚡ PROBAR MODO DEMO' : '⚡ TRY DEMO MODE';
        }

        function togglePass(inputId, btn) {
            var input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
            btn.textContent = input.type === 'password' ? '👁️' : '🙈';
        }

        function checkStrength() {
            var pw = document.getElementById('regPassword').value;
            var s = 0;
            if (pw.length >= 8) s++;
            if (pw.length >= 12) s++;
            if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
            if (/\d/.test(pw)) s++;
            if (/[^a-zA-Z0-9]/.test(pw)) s++;
            var levels = [{w:25,c:'#ff4466'},{w:50,c:'#ffaa00'},{w:75,c:'#00d4ff'},{w:100,c:'#00ff88'}];
            var lvl = levels[Math.min(s-1,3)] || levels[0];
            document.getElementById('strengthBar').style.width = lvl.w + '%';
            document.getElementById('strengthBar').style.background = lvl.c;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('formLogin').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('formRegister').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('registerError').style.display = 'none';
            document.getElementById('registerSuccess').style.display = 'none';
        }

        function selectPlan(plan) {
            selectedPlan = plan;
            document.getElementById('planPremium').classList.toggle('selected', plan === 'premium');
            document.getElementById('planPlatinum').classList.toggle('selected', plan === 'platinum');
        }

        // ═══════════════ HANDLERS ═══════════════
        function handleLogin() {
            var email = document.getElementById('loginEmail').value.trim();
            var pass = document.getElementById('loginPassword').value;
            var errEl = document.getElementById('loginError');
            errEl.style.display = 'none';

            if (!email || !pass) {
                errEl.textContent = '❌ Todos los campos son obligatorios';
                errEl.style.display = 'block';
                return;
            }

            alert('✅ Login exitoso (simulado)\nEmail: ' + email + '\nRedirigiendo a DEMO...');
            window.location.href = 'itzli-demo.html';
        }

        function handleRegister() {
            var name = document.getElementById('regName').value.trim();
            var email = document.getElementById('regEmail').value.trim();
            var pass = document.getElementById('regPassword').value;
            var pass2 = document.getElementById('regPassword2').value;
            var errEl = document.getElementById('registerError');
            var sucEl = document.getElementById('registerSuccess');
            var btn = document.querySelector('.btn-register');

            errEl.style.display = 'none';
            sucEl.style.display = 'none';

            if (!name || !email || !pass || !pass2) {
                errEl.textContent = '❌ Todos los campos son obligatorios';
                errEl.style.display = 'block';
                return;
            }
            if (pass.length < 8) {
                errEl.textContent = '❌ Contraseña: mínimo 8 caracteres';
                errEl.style.display = 'block';
                return;
            }
            if (pass !== pass2) {
                errEl.textContent = '❌ Las contraseñas no coinciden';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Procesando...';
            btn.style.opacity = '0.7';

            // Simular registro y redirigir a Stripe
            setTimeout(function() {
                sucEl.textContent = '✅ Registro exitoso. Redirigiendo al pago...';
                sucEl.style.display = 'block';
                
                // Redirigir a Stripe Checkout
                fetch('http://localhost:3000/api/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plan: selectedPlan, email: email })
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.url) {
                        window.location.href = data.url;
                    } else {
                        errEl.textContent = '❌ Error al crear pago';
                        errEl.style.display = 'block';
                        btn.disabled = false;
                        btn.textContent = '✨ CREAR CUENTA Y PAGAR';
                        btn.style.opacity = '1';
                    }
                })
                .catch(function() {
                    // Si falla Stripe, ir a demo
                    alert('✅ Registro exitoso (pago simulado)\nRedirigiendo a DEMO...');
                    window.location.href = 'itzli-demo.html';
                });
            }, 1000);
        }

        function handleDemo() {
            window.location.href = 'itzli-demo.html';
        }

        // Enter key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (currentTab === 'login') handleLogin();
                else handleRegister();
            }
        });
    </script>
</body>
</html>
