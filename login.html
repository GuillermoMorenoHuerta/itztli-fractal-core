<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITZTLI FRACTAL · Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0a08;
            background-image: radial-gradient(circle at 10% 20%, #2a1f12, #0d0a08 80%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(20, 15, 10, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #b8860b;
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(184, 134, 11, 0.3);
            transition: all 0.3s ease;
        }
        .login-card:hover { box-shadow: 0 20px 80px rgba(184, 134, 11, 0.5); }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #f5d37c, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .lang-toggle {
            background: #2a1f12;
            border: 1px solid #b8860b;
            border-radius: 40px;
            padding: 6px 12px;
            color: #e6c87a;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lang-toggle:hover { background: #3a2a18; border-color: #d4a017; }
        .plan-badge {
            background: rgba(184, 134, 11, 0.15);
            border-radius: 40px;
            padding: 8px 16px;
            text-align: center;
            margin-bottom: 24px;
            font-size: 14px;
            color: #e6c87a;
            border: 1px dashed #b8860b;
        }
        .plan-badge strong { color: #f5d37c; text-transform: uppercase; letter-spacing: 1px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #c4a87a;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 40px;
            border: 1px solid #5a4a2a;
            background: #1a150e;
            color: #f0e0c0;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #d4a017;
            box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.3);
        }
        .form-group input::placeholder { color: #7a6a4a; }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4a017, #b8860b);
            border: none;
            border-radius: 40px;
            padding: 14px;
            font-weight: 700;
            font-size: 16px;
            color: #1a150e;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 20px rgba(184, 134, 11, 0.4);
            width: 100%;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(184, 134, 11, 0.6);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #8a7a5a;
            border-radius: 40px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            color: #d4c09a;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .btn-secondary:hover {
            background: rgba(184, 134, 11, 0.1);
            border-color: #b8860b;
        }
        .error-msg {
            background: rgba(200, 70, 40, 0.15);
            border-left: 4px solid #c84a28;
            padding: 10px 14px;
            border-radius: 12px;
            color: #f0b090;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        .extra-info {
            text-align: center;
            color: #6a5a4a;
            font-size: 13px;
            margin-top: 20px;
            border-top: 1px solid #2a1f12;
            padding-top: 18px;
        }
        .extra-info a { color: #d4a017; text-decoration: none; }
        .extra-info a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .login-card { padding: 30px 20px; }
            .logo { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="header">
        <div class="logo">✦ ITZTLI FRACTAL</div>
        <div class="lang-toggle" id="langToggle">
            <i class="fas fa-globe"></i>
            <span id="langLabel">ES</span>
        </div>
    </div>

    <div class="plan-badge">
        <span data-i18n="planLabel">Plan seleccionado:</span>
        <strong id="planName">DEMO</strong>
    </div>

    <form id="loginForm" autocomplete="off">
        <div class="form-group">
            <label for="nombre" data-i18n="nombreLabel">Nombre (opcional)</label>
            <input type="text" id="nombre" placeholder="Ej: Juan Pérez" data-i18n-placeholder="nombrePlaceholder" />
        </div>
        <div class="form-group">
            <label for="email" data-i18n="emailLabel">Correo electrónico</label>
            <input type="email" id="email" placeholder="tú@ejemplo.com" required data-i18n-placeholder="emailPlaceholder" />
        </div>
        <div class="form-group">
            <label for="password" data-i18n="passLabel">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required data-i18n-placeholder="passPlaceholder" />
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="actions">
            <button type="submit" class="btn-primary" id="btnSubmit">Registrarse</button>
            <button type="button" class="btn-secondary" id="btnToggle">Ya tengo cuenta · Iniciar sesión</button>
        </div>
    </form>

    <div class="extra-info">
        <span data-i18n="forgot">¿Olvidaste tu contraseña?</span>
        <a href="#" data-i18n="resetLink">Recupérala aquí</a>
        <br />
        <span data-i18n="info">Al registrarte aceptas nuestros</span>
        <a href="terminos.html" data-i18n="terms">Términos y condiciones</a>
    </div>
    <div style="margin-top: 20px; text-align: center; font-size: 12px; color: #5a4a3a;">
        ⚡ ITZTLI FRACTAL CORE
    </div>
</div>

<script>
    // ============================================================
    // CONFIGURACIÓN SUPABASE (PÚBLICA)
    // ============================================================
    const SUPABASE_URL = 'https://rpoqukrcvkcmaqsajchk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_eamhRTq61t3fVIMSUcRYwQ_-VLGFGJ5';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // PLAN Y REDIRECCIONES (NOMBRES CORRECTOS)
    // ============================================================
    const urlParams = new URLSearchParams(window.location.search);
    let selectedPlan = urlParams.get('plan') || 'demo';
    if (!['demo', 'premium', 'platinum'].includes(selectedPlan)) {
        selectedPlan = 'demo';
    }
    document.getElementById('planName').textContent = selectedPlan.toUpperCase();

    const redirectMap = {
        'demo': 'demo-registro.html',
        'premium': 'itzli-premium.html',
        'platinum': 'itzli-platinum.html'
    };

    // ============================================================
    // BILINGÜISMO
    // ============================================================
    let currentLang = 'es';
    const i18n = {
        es: {
            planLabel: 'Plan seleccionado:',
            nombreLabel: 'Nombre (opcional)',
            nombrePlaceholder: 'Ej: Juan Pérez',
            emailLabel: 'Correo electrónico',
            emailPlaceholder: 'tú@ejemplo.com',
            passLabel: 'Contraseña',
            passPlaceholder: '••••••••',
            btnRegister: 'Registrarse',
            btnLogin: 'Ya tengo cuenta · Iniciar sesión',
            forgot: '¿Olvidaste tu contraseña?',
            resetLink: 'Recupérala aquí',
            info: 'Al registrarte aceptas nuestros',
            terms: 'Términos y condiciones',
            errorGeneral: 'Ocurrió un error. Intenta de nuevo.',
            errorEmail: 'El correo no es válido.',
            errorPass: 'La contraseña debe tener al menos 6 caracteres.',
            errorNetwork: 'Error de red. Verifica tu conexión.',
            errorUserExists: 'El correo ya está registrado.',
            errorInvalidCreds: 'Correo o contraseña incorrectos.',
            successRegister: '¡Registro exitoso! Redirigiendo...',
            successLogin: 'Inicio de sesión exitoso. Redirigiendo...'
        },
        en: {
            planLabel: 'Selected plan:',
            nombreLabel: 'Name (optional)',
            nombrePlaceholder: 'e.g. John Doe',
            emailLabel: 'Email address',
            emailPlaceholder: 'you@example.com',
            passLabel: 'Password',
            passPlaceholder: '••••••••',
            btnRegister: 'Sign up',
            btnLogin: 'Already have an account · Log in',
            forgot: 'Forgot your password?',
            resetLink: 'Reset it here',
            info: 'By registering you agree to our',
            terms: 'Terms & Conditions',
            errorGeneral: 'An error occurred. Please try again.',
            errorEmail: 'Invalid email address.',
            errorPass: 'Password must be at least 6 characters.',
            errorNetwork: 'Network error. Check your connection.',
            errorUserExists: 'Email already registered.',
            errorInvalidCreds: 'Incorrect email or password.',
            successRegister: 'Registration successful! Redirecting...',
            successLogin: 'Login successful. Redirecting...'
        }
    };

    function updateLanguage(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (i18n[lang] && i18n[lang][key]) {
                el.textContent = i18n[lang][key];
            }
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (i18n[lang] && i18n[lang][key]) {
                el.placeholder = i18n[lang][key];
            }
        });
        document.getElementById('langLabel').textContent = lang.toUpperCase();
        updateButtonLabels();
    }

    // ============================================================
    // MODO REGISTRO / LOGIN
    // ============================================================
    let isRegisterMode = true;

    function updateButtonLabels() {
        const btn = document.getElementById('btnSubmit');
        const toggleBtn = document.getElementById('btnToggle');
        if (isRegisterMode) {
            btn.textContent = i18n[currentLang].btnRegister;
            toggleBtn.textContent = i18n[currentLang].btnLogin;
        } else {
            btn.textContent = i18n[currentLang].btnLogin;
            toggleBtn.textContent = i18n[currentLang].btnRegister;
        }
    }

    // ============================================================
    // EVENTOS
    // ============================================================
    document.getElementById('langToggle').addEventListener('click', function() {
        currentLang = (currentLang === 'es') ? 'en' : 'es';
        updateLanguage(currentLang);
    });

    document.getElementById('btnToggle').addEventListener('click', function() {
        isRegisterMode = !isRegisterMode;
        updateButtonLabels();
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('errorMsg').textContent = '';
    });

    // ============================================================
    // REGISTRO / LOGIN CON TRIGGER
    // ============================================================
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.style.display = 'none';
        errorDiv.textContent = '';

        const nombre = document.getElementById('nombre').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            showError(currentLang === 'es' ? 'Completa todos los campos.' : 'Fill all fields.');
            return;
        }
        if (password.length < 6) {
            showError(i18n[currentLang].errorPass);
            return;
        }
        if (!email.includes('@')) {
            showError(i18n[currentLang].errorEmail);
            return;
        }

        try {
            if (isRegisterMode) {
                // ---- REGISTRO (EL TRIGGER CREA EL PERFIL AUTOMÁTICAMENTE) ----
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            nombre: nombre || '',
                            plan: selectedPlan,
                            role: 'user'
                        }
                    }
                });

                if (authError) {
                    if (authError.message.includes('already registered')) {
                        showError(i18n[currentLang].errorUserExists);
                    } else if (authError.message.includes('rate limit')) {
                        showError('⚠️ ' + (currentLang === 'es' ? 'Demasiados intentos. Espera.' : 'Too many attempts. Wait.'));
                    } else {
                        showError(authError.message);
                    }
                    return;
                }

                if (!authData.user) {
                    showError(i18n[currentLang].errorGeneral);
                    return;
                }

                // El trigger de Supabase ya creó el perfil en la tabla 'usuarios'
                showSuccess(i18n[currentLang].successRegister);
                setTimeout(() => {
                    window.location.href = redirectMap[selectedPlan];
                }, 1500);

            } else {
                // ---- LOGIN ----
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (authError) {
                    if (authError.message.includes('Invalid login credentials')) {
                        showError(i18n[currentLang].errorInvalidCreds);
                    } else {
                        showError(authError.message);
                    }
                    return;
                }

                if (!authData.user) {
                    showError(i18n[currentLang].errorGeneral);
                    return;
                }

                // Obtener el plan del usuario
                const { data: userData, error: fetchError } = await supabase
                    .from('usuarios')
                    .select('plan')
                    .eq('id', authData.user.id)
                    .single();

                const userPlan = (userData && userData.plan) || 'demo';
                const redirectUrl = redirectMap[userPlan] || 'demo-registro.html';
                showSuccess(i18n[currentLang].successLogin);
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1500);
            }
        } catch (err) {
            console.error('Error:', err);
            if (err.message && err.message.includes('fetch')) {
                showError(i18n[currentLang].errorNetwork);
            } else {
                showError(i18n[currentLang].errorGeneral);
            }
        }
    });

    // ============================================================
    // FUNCIONES AUXILIARES
    // ============================================================
    function showError(msg) {
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        errorDiv.style.borderLeftColor = '#c84a28';
        errorDiv.style.color = '#f0b090';
    }

    function showSuccess(msg) {
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        errorDiv.style.borderLeftColor = '#4aff8a';
        errorDiv.style.color = '#b0ffd0';
    }

    // ============================================================
    // INICIALIZAR
    // ============================================================
    updateLanguage('es');
    updateButtonLabels();
    console.log('🔐 Login listo. Plan:', selectedPlan);
</script>

</body>
</html>
