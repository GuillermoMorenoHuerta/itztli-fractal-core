<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenido a ITZTLI · Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0a08;
            background-image: radial-gradient(circle at 10% 20%, #2a1f12, #0d0a08 80%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .welcome-card {
            background: rgba(20, 15, 10, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #b8860b;
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(184, 134, 11, 0.3);
            text-align: center;
        }
        .welcome-card h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #f5d37c, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .welcome-card p {
            color: #c4a87a;
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .welcome-card .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #5a4a2a;
            border-top: 3px solid #b8860b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .welcome-card .timer {
            color: #b8860b;
            font-size: 14px;
            margin-top: 10px;
        }
        .welcome-card .badge {
            display: inline-block;
            background: linear-gradient(135deg, #b8860b, #f5d37c);
            color: #0d0a08;
            font-weight: bold;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <div class="badge">★ PREMIUM</div>
        <h1>✦ BIENVENIDO</h1>
        <p>Tu cuenta <strong style="color:#f5d37c;">premium</strong> ha sido creada exitosamente.<br />
        Estás a punto de ingresar a tu <strong style="color:#f5d37c;">Comando Central</strong>.</p>
        <div class="spinner"></div>
        <p class="timer">Redirigiendo en <span id="countdown">5</span> segundos...</p>
    </div>
    <script>
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');
        const interval = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                // Redirigir directamente a comando-central.html
                window.location.href = 'comando-central.html';
            }
        }, 1000);
    </script>
</body>
</html>
